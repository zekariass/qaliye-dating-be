server:
  port: 8080

spring:
  application:
    name: qaliye-backend

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION:30000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URL}
          jws-algorithms:
            - ES256

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000

  jackson:
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  realtime-broadcast-url: ${SUPABASE_REALTIME_BROADCAST_URL:${SUPABASE_URL}/realtime/v1/api/broadcast}
  jwt-issuer: ${SUPABASE_JWT_ISSUER:}
  jwt-audience: ${SUPABASE_JWT_AUDIENCE:}
  auth:
    send-sms-hook-secret: ${SUPABASE_AUTH_SEND_SMS_HOOK_SECRET:v1,whsec_E1H2WXyrRXBRZM8eiyGUO6bpzDK1TYmfp+KXPikKOwq4GfYVMff2LySxloKJHbAJzv3t1TfWGMKIXXxZ}

sms:
