app:
  cache:
    user-status-ttl-seconds: 60
    subscription-features-ttl-seconds: 300
  internal:
    webhook-secret: ${INTERNAL_WEBHOOK_SECRET:dkdkdkdk}
  version:
    android:
      latest: ${APP_ANDROID_LATEST_VERSION:1.0.5}
      minimum: ${APP_ANDROID_MINIMUM_VERSION:1.0.1}
      force-update: ${APP_ANDROID_FORCE_UPDATE:false}
      store-url: ${APP_ANDROID_STORE_URL:https://play.google.com/store/apps/details?id=com.qaliye.app}
    ios:
      latest: ${APP_ANDROID_LATEST_VERSION:1.0.9}
      minimum: ${APP_ANDROID_MINIMUM_VERSION:1.0.0}
      force-update: ${APP_ANDROID_FORCE_UPDATE:false}
      store-url: ${APP_IOS_STORE_URL:https://apps.apple.com/app/qaliye/id123456789}

discovery:
  primary-placement-weight: ${DISCOVERY_PRIMARY_PLACEMENT_WEIGHT:100}
  new-match-threshold-hours: ${DISCOVERY_NEW_MATCH_THRESHOLD_HOURS:168}
  rewind:
    match-grace-period-minutes: 10
  queue:
    batch-size: 10
  cursor:
    max-age-minutes: 30
  distance:
    min-km: 1

storage:
  signed-url:
    ttl-seconds: 7200

support:
  attachments-bucket: ${SUPPORT_ATTACHMENTS_BUCKET:support-attachments}
  attachment-signed-url-ttl-seconds: ${SUPPORT_ATTACHMENT_SIGNED_URL_TTL_SECONDS:300}
  max-file-size-bytes: ${SUPPORT_MAX_FILE_SIZE_BYTES:52428800}
  max-files-per-message: ${SUPPORT_MAX_FILES_PER_MESSAGE:10}
  allowed-content-types:
    - image/jpeg
    - image/png
    - image/webp
    - application/pdf
    - text/plain
  voice-max-duration-seconds: ${SUPPORT_VOICE_MAX_DURATION_SECONDS:300}
  voice-max-file-size-bytes: ${SUPPORT_VOICE_MAX_FILE_SIZE_BYTES:52428800}
  voice-allowed-content-types:
    - audio/m4a
    - audio/mp4
    - audio/aac
    - audio/mpeg
    - audio/wav
    - audio/webm
    - audio/x-m4a

activity-status:
  online-window-seconds: ${ACTIVITY_STATUS_ONLINE_WINDOW_SECONDS:180}
  recently-active-window-seconds: ${ACTIVITY_STATUS_RECENTLY_ACTIVE_WINDOW_SECONDS:900}
  heartbeat-write-min-interval-seconds: ${ACTIVITY_HEARTBEAT_WRITE_MIN_INTERVAL_SECONDS:60}


push:
  enabled: ${PUSH_ENABLED:true}
  app-environment: ${PUSH_APP_ENVIRONMENT:PRODUCTION}

  expo:
    send-url: ${EXPO_PUSH_SEND_URL:https://exp.host/--/api/v2/push/send}
    receipts-url: ${EXPO_PUSH_RECEIPTS_URL:https://exp.host/--/api/v2/push/getReceipts}
    access-token: ${EXPO_PUSH_ACCESS_TOKEN:}
    send-batch-size: ${EXPO_PUSH_SEND_BATCH_SIZE:100}
    receipt-batch-size: ${EXPO_PUSH_RECEIPT_BATCH_SIZE:1000}

  outbox:
    batch-size: ${PUSH_OUTBOX_BATCH_SIZE:100}
    poll-interval-ms: ${PUSH_OUTBOX_POLL_INTERVAL_MS:1000}
    lease-seconds: ${PUSH_OUTBOX_LEASE_SECONDS:60}
    max-attempts: ${PUSH_OUTBOX_MAX_ATTEMPTS:10}
    max-backoff-seconds: ${PUSH_OUTBOX_MAX_BACKOFF_SECONDS:900}

  delivery:
    poll-interval-ms: ${PUSH_DELIVERY_POLL_INTERVAL_MS:1000}
    lease-seconds: ${PUSH_DELIVERY_LEASE_SECONDS:60}
    max-attempts: ${PUSH_DELIVERY_MAX_ATTEMPTS:10}
    max-backoff-seconds: ${PUSH_DELIVERY_MAX_BACKOFF_SECONDS:900}

  receipts:
    initial-delay-minutes: ${PUSH_RECEIPT_INITIAL_DELAY_MINUTES:15}
    deadline-hours: ${PUSH_RECEIPT_DEADLINE_HOURS:23}

  marketing:
    min-interval-days: ${PUSH_MARKETING_MIN_INTERVAL_DAYS:7}
    reservation-minutes: ${PUSH_MARKETING_RESERVATION_MINUTES:30}

aws:
  region: ${AWS_REGION:eu-central-1}
  credentials:
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    session-token: ${AWS_SESSION_TOKEN:}

image:
  moderation:
    enabled: ${IMAGE_MODERATION_ENABLED:true}
    max-retries: ${IMAGE_MODERATION_MAX_RETRIES:3}
    retry-initial-delay-ms: ${IMAGE_MODERATION_RETRY_INITIAL_DELAY_MS:1000}
    face-detection:
      enabled: ${IMAGE_FACE_DETECTION_ENABLED:true}
      min-confidence: ${IMAGE_FACE_MIN_CONFIDENCE:95.0}
      min-brightness: ${IMAGE_FACE_MIN_BRIGHTNESS:3.0}
      min-sharpness: ${IMAGE_FACE_MIN_SHARPNESS:3.0}
      min-size-percent: ${IMAGE_FACE_MIN_SIZE_PERCENT:0.0}
      occlusion-check-enabled: ${IMAGE_FACE_OCCLUSION_CHECK_ENABLED:false}
    nudity-moderation:
      enabled: ${IMAGE_NUDITY_MODERATION_ENABLED:true}
      min-confidence: ${IMAGE_NUDITY_MIN_CONFIDENCE:90.0}
      suggestive-content-action: ${IMAGE_SUGGESTIVE_CONTENT_ACTION:MANUAL_REVIEW} # MANUAL_REVIEW, APPROVE or REJECT

identity:
  verification:
    similarity-threshold: ${IDENTITY_VERIFICATION_SIMILARITY_THRESHOLD:80.0}

logging:
  level:
    org.springframework.security: DEBUG
    com.qaliye.backend.discovery.service.LikesService: DEBUG
    com.qaliye.backend.discovery.service.MatchesService: DEBUG
    com.qaliye.backend.billing.service.OfferService: DEBUG
    com.qaliye.backend.billing.controller.BillingWebhookController: DEBUG