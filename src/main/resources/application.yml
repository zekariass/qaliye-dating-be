  afromessage:
    base-url: ${AFROMESSAGE_BASE_URL:https://api.afromessage.com/api/send}
    token: ${AFROMESSAGE_TOKEN:eyJhbGciOiJIUzI1NiJ9.eyJpZGVudGlmaWVyIjoid2szSlZwSDhHU2tsdTRkTFZxaUQwS004cmVvNm95MUciLCJleHAiOjE5NDE0MDUwMzcsImlhdCI6MTc4MzYzODYzNywianRpIjoiODU0OThhYTItMGM3Ni00ZjUwLThkZWQtMTRkMTc3ODZjMDM1In0.fuS6OaQIfgSDri5QajDT61z5wi_utBMS0t3_jsAn2fY}
