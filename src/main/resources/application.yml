chat:
  outbox:
    batch-size: ${CHAT_OUTBOX_BATCH_SIZE:100}
    poll-interval-ms: ${CHAT_OUTBOX_POLL_INTERVAL:500}
    lease-seconds: ${CHAT_OUTBOX_LEASE_SECONDS:60}
    max-attempts: ${CHAT_OUTBOX_MAX_ATTEMPTS:20}
    max-backoff-seconds: ${CHAT_OUTBOX_MAX_BACKOFF_SECONDS:300}
  rate-limit:
    enabled: ${CHAT_RATE_LIMIT_ENABLED:true}
    user-per-minute: ${CHAT_RATE_LIMIT_USER_PER_MINUTE:30}
    match-per-minute: ${CHAT_RATE_LIMIT_MATCH_PER_MINUTE:12}
    cache-max-size: ${CHAT_RATE_LIMIT_CACHE_MAX_SIZE:100000}
    cache-expire-minutes: ${CHAT_RATE_LIMIT_CACHE_EXPIRE_MINUTES:5}
    window-millis: ${CHAT_RATE_LIMIT_WINDOW_MILLIS:60000}
  cursor:
    hmac-secret: ${CHAT_CURSOR_HMAC_SECRET:change-me-in-production}
  attachment:
    bucket: ${CHAT_ATTACHMENTS_BUCKET:chat-attachments}
    signed-url-ttl-seconds: ${CHAT_ATTACHMENT_SIGNED_URL_TTL_SECONDS:300}
    image-max-file-size-bytes: ${CHAT_IMAGE_MAX_FILE_SIZE_BYTES:26214400}
    voice-max-file-size-bytes: ${CHAT_VOICE_MAX_FILE_SIZE_BYTES:26214400}
    voice-max-duration-seconds: ${CHAT_VOICE_MAX_DURATION_SECONDS:300}
    max-image-attachments: ${CHAT_MAX_IMAGE_ATTACHMENTS:5}
    max-voice-attachments: ${CHAT_MAX_VOICE_ATTACHMENTS:1}
    max-total-attachments: ${CHAT_MAX_TOTAL_ATTACHMENTS:5}
    allowed-image-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
      - image/bmp
      - image/heic
      - image/heif
      - image/avif
      - image/tiff
    allowed-voice-content-types:
      - audio/m4a
      - audio/mp4
      - audio/aac
      - audio/mpeg
      - audio/x-m4a
      - audio/mp3
      - audio/ogg
      - audio/wav
      - audio/x-wav
      - audio/webm
      - audio/flac
      - audio/3gpp
      - audio/amr

